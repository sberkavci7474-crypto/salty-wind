<meta charset="utf-8">
<title>BLOCK JUU</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BLOCK JUU"><meta name="theme-color" content="#1B2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --ink:#1B2440;--paper:#FFF4DD;--paper2:#F1DDB4;--coral:#FF6A3D;--sea:#1FA3B5;--deep:#16707F;
  --leaf:#4FAE45;--gold:#F5B82E;--stone:#7D8BA3;--red:#E8424A;--violet:#9B5DE5;--mute:#8C95A3;
  --sr:calc(16px + env(safe-area-inset-right,0px));
  --st:calc(10px + env(safe-area-inset-top,0px));--sb:calc(12px + env(safe-area-inset-bottom,0px));
  --lift:0px;color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd9e6}
body{font-family:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink);touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
svg.i{display:block;overflow:visible}
.ol{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}

/* ÜST: HP | LEVEL | XP | GOLD | ÇANTA */
#top{position:absolute;top:var(--st);left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 32px));display:flex;align-items:center;gap:9px;
  background:rgba(27,36,64,.86);border:3px solid var(--ink);border-radius:18px;padding:5px 8px;box-shadow:0 4px 0 var(--ink)}
.stat{display:flex;align-items:center;gap:5px;min-width:0}
.stat svg{width:24px;height:24px;flex:none}
.bar{position:relative;height:18px;border-radius:9px;background:#3a4466;border:2px solid #0f1530;overflow:hidden;flex:1;min-width:0}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .2s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1;color:#fff;text-shadow:0 1px 0 #0f1530;font-variant-numeric:tabular-nums;white-space:nowrap}
#sHp{flex:1.1}#sHp .bar i{background:linear-gradient(#ff8a6b,#E8424A)}
#sLv{flex:none;background:var(--sea);border:2px solid var(--ink);border-radius:10px;padding:0 8px;height:26px;font-weight:800;font-size:15px;color:#fff;letter-spacing:.04em}
#sLv b{font-size:18px;margin-left:3px;font-variant-numeric:tabular-nums}
#sXp{flex:1.2}#sXp .bar i{background:linear-gradient(#ffe08a,#F5B82E)}
.num{flex:none;font-weight:800;font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
#sGold{min-width:70px}#sBag{font-size:15px}
#sBag.full{color:#ffb3a8}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.2)}}
.tb{width:30px;height:30px;flex:none;border-radius:9px;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center}
.tb svg{width:20px;height:20px}
#mlock{display:none}
@media (hover:hover) and (pointer:fine){#mlock{display:grid}}
#mlock.on{background:var(--gold)}
#obj{position:absolute;top:calc(var(--st) + 50px);left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#obj em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--coral);flex:none}
#obj{pointer-events:auto;cursor:pointer}#obj::after{content:'▸';font-weight:800;color:var(--deep);margin-left:2px}
#alert{position:absolute;top:calc(var(--st) + 84px);left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;background:#ffe1d8;border:3px solid var(--red);border-radius:14px;padding:2px 12px;font-weight:800;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:alarm 1s infinite alternate}
#alert em{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--red);flex:none}
#pactC{flex:none;display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:9px;border:2px solid var(--ink);color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 0 var(--ink);background:#9BC53D}#pactC b{font-variant-numeric:tabular-nums}
#prompt.mini{padding:4px;gap:0}#prompt.mini .tx,#prompt.mini kbd{display:none}#prompt.mini.reveal{padding-right:14px;gap:8px}#prompt.mini.reveal .tx{display:flex}
#fiA{flex:none;display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:9px;border:2px solid var(--ink);color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 0 var(--ink);background:#4FAE45}#fiA b{font-variant-numeric:tabular-nums}
#thr{flex:none;display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:9px;border:2px solid var(--ink);color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 0 var(--ink);background:var(--leaf)}
#thr b{font-variant-numeric:tabular-nums}
.bb.warn{animation:pulse .45s infinite alternate}
.row .btn{min-height:34px}
@media (max-height:430px){.cmdB{width:56px;height:56px;margin:-28px 0 0 -28px}#combat{bottom:calc(var(--sb) + 20px);transform:scale(.78);transform-origin:100% 100%}}
@keyframes alarm{to{box-shadow:0 3px 0 var(--ink),0 0 0 4px rgba(232,66,74,.35)}}
#saved{position:absolute;top:calc(var(--st) + 50px);right:var(--sr);font-size:12px;font-weight:800;opacity:0;transition:opacity .4s}
#saved.on{opacity:1}
#toasts{position:absolute;top:calc(var(--st) + 120px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(440px,84vw)}
.toast{background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:5px 14px;border-radius:14px;animation:tin .25s ease-out;text-align:center}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:clamp(30px,7vw,62px);font-weight:800;letter-spacing:.04em;opacity:0;line-height:1;padding:0 16px}
#banner small{display:block;font-size:.36em;letter-spacing:.02em;margin-top:6px}
#banner.show{animation:ban 2.2s ease-out}
#banner.bad{color:#ffd0d0}
@keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

.plate{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}
.plate .pn{font-size:13px;font-weight:800;white-space:nowrap;line-height:1}
.plate .pn em{font-style:normal;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;margin-left:4px;font-size:11px;text-shadow:none}
.plate .pi{font-size:11px;font-weight:800;white-space:nowrap;background:rgba(255,244,221,.92);border:2px solid var(--ink);border-radius:8px;padding:0 6px;line-height:1.3}
.plate .pb{width:76px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#3a4466;overflow:hidden}
.plate .pb i{display:block;height:100%;background:linear-gradient(#ff8a6b,#E8424A)}
.plate.ally .pb i{background:linear-gradient(#8be07c,#3DA84F)}.plate.ally .pn em{background:var(--leaf)}
.plate.yard .pb{width:120px;height:14px}.plate.yard .pb i{background:linear-gradient(#7fd9e6,#1FA3B5)}
.plate.small .pn,.plate.small .pi{display:none}.plate.small .pb{width:46px;height:8px}
.plate.ship .pn{font-size:15px}.plate.ship .pb{display:none}
.plate.ship .pi{color:#fff;border-color:var(--ink)}
.fl{position:absolute;left:0;top:0;font-weight:800;font-size:20px;white-space:nowrap;will-change:transform,opacity}
.fl.big{font-size:30px;color:var(--gold)}.fl.hurt{color:#ff8080}.fl.gold{font-size:17px;color:#ffe08a}
.fl.info{font-size:14px;color:var(--ink);text-shadow:none;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:0 8px}

#joy{position:absolute;inset:0;pointer-events:none}
#joyBase{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,244,221,.16) 0 55%,rgba(255,244,221,.3) 56% 100%);border:3px solid rgba(27,36,64,.45);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
#joyBase svg{position:absolute;inset:0;width:100%;height:100%}
#joyKnob{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,var(--paper) 45%,var(--paper2) 100%);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(27,36,64,.6)}
#joy.idle #joyBase,#joy.idle #joyKnob{opacity:.5}
#joy.off{opacity:.2}
#camHint{position:absolute;right:calc(var(--sr) + 150px);top:44%;font-size:13px;font-weight:800;opacity:.9;pointer-events:none;text-align:center;line-height:1.1}

#combat{position:absolute;right:var(--sr);bottom:calc(var(--sb) + 26px + var(--lift));width:92px;height:92px}
.rb{--c:var(--coral);position:relative;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 -8px 0 rgba(0,0,0,.15);display:grid;place-items:center}
.rb::before{content:'';position:absolute;inset:5px;border:2px dashed rgba(255,255,255,.5);border-radius:50%;pointer-events:none}
.rb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.15)}
#bAtk{width:92px;height:92px}#bAtk svg{width:48px;height:48px}
#bCombo{--c:var(--violet);width:70px;height:70px;position:absolute;left:-92px;top:16px}#bCombo svg{width:36px;height:36px}
.rb>span{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:14px;font-weight:800;white-space:nowrap;line-height:1}
kbd{font:800 11px 'Baloo 2',sans-serif;background:var(--paper);border:2px solid var(--ink);border-radius:7px;padding:0 5px;display:none;color:var(--ink);text-shadow:none}
.rb kbd,.bb kbd{position:absolute;top:-8px;right:-6px}
@media (hover:hover) and (pointer:fine){kbd{display:block}#prompt kbd{display:inline-block}#camHint{display:none}}
.cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(rgba(15,21,48,.72) calc(var(--cd,0)*1%),transparent 0);pointer-events:none}
.cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;pointer-events:none}
#bCombo.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(155,93,229,.35),inset 0 -8px 0 rgba(0,0,0,.15)}}
#skills{position:absolute;left:0;top:0;width:92px;height:92px}
/* Yetenekler sağ kenarda: ATTACK altta, üstünde OK ve DRONE; COMBO ve POWER sollarında */
#bAtk{position:absolute;right:0;bottom:0}#bBow{position:absolute;left:17px;top:-86px}
.rb.sk{width:58px;height:58px}.rb.sk svg{width:30px;height:30px}
#bBow{--c:#A0643A}#bDrone{--c:#16707F}#bDrone.out{--c:var(--coral)}
.skrow{position:absolute;left:17px;top:-170px;width:58px;height:58px}
#bPow{--c:#C2410C;position:absolute;left:-60px;top:5px;width:48px;height:48px}#bPow svg{width:24px;height:24px}
#bPow .cnt{left:auto;right:-10px;top:-12px;font-size:9px;letter-spacing:-.5px;padding:0 3px}#bPow.ready{animation:ready 1.2s ease-in-out infinite}
#cmd{position:absolute;inset:0;pointer-events:auto;background:rgba(15,21,48,.42);z-index:20}
#cmdRing{position:absolute;width:0;height:0}
.cmdB{--c:var(--sea);position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 0 var(--ink);line-height:1;animation:card .2s ease-out}
.cmdB b{font-size:11px;font-weight:800;letter-spacing:.02em}.cmdB small{font-size:9px;font-weight:700;margin-top:3px;max-width:58px;text-align:center}
.cmdB.on{outline:3px solid #fff;outline-offset:1px}.cmdB[disabled]{filter:grayscale(.85);opacity:.55}
.cmdB:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#cmdC{position:absolute;width:98px;height:98px;margin:-49px 0 0 -49px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:4px}
#cmdC b{font-size:15px;font-weight:800}#cmdC small{font-size:10px;font-weight:700;color:#5d6475}#cmdC em{font-style:normal;font-size:9px;font-weight:800;color:var(--deep);margin-top:3px;letter-spacing:.04em}
.rb .cnt{position:absolute;top:-9px;left:-10px;min-width:22px;text-align:center;background:var(--paper);border:2px solid var(--ink);border-radius:9px;padding:0 5px;font-size:12px;font-weight:800;line-height:1.35;color:var(--ink);text-shadow:none}
.rb.lock{filter:grayscale(.85) brightness(.92)}

#bar{position:absolute;left:50%;bottom:var(--sb);transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end}
.bb{--c:var(--sea);position:relative;width:74px;height:62px;border-radius:18px;background:var(--c);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2px}
.bb svg{width:30px;height:30px}
.bb b{font-size:11px;font-weight:800;letter-spacing:.05em;line-height:1.1}
.bb small{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:11px;font-weight:800;white-space:nowrap;line-height:1.3}
.bb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bb.dim{filter:saturate(.35) brightness(.95)}
#bInv{--c:var(--gold)}#bBoat{--c:var(--deep)}#bPot{--c:#C0392B}
.bb .cd{border-radius:16px}.bb .cdn{font-size:18px}
#boatHp{position:absolute;left:6px;right:6px;bottom:4px;height:5px;border-radius:3px;background:#0f1530;overflow:hidden}
#boatHp i{display:block;height:100%;background:#8be07c}

#prompt{position:absolute;left:50%;bottom:calc(var(--sb) + 86px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 20px 5px 5px;
  background:var(--leaf);border:3px solid var(--ink);border-radius:36px;box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.14);max-width:calc(100% - 32px)}
#prompt .ic{width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;flex:none}
#prompt .ic svg{width:30px;height:30px}
#prompt .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;min-width:0}
#prompt b{font-size:21px;font-weight:800;white-space:nowrap}
#prompt small{font-size:12px;font-weight:800;white-space:nowrap}
#prompt small i{font-style:normal;padding:0 6px;border-radius:7px;border:2px solid var(--ink);color:#fff;margin-left:2px}
#prompt.off{background:var(--mute)}
#prompt:active{transform:translate(-50%,4px);box-shadow:0 1px 0 var(--ink)}
#prompt2{position:absolute;right:var(--sr);top:calc(var(--st) + 90px);background:var(--red);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:4px 12px;font-weight:800;font-size:15px}
@media (max-width:600px){
  :root{--lift:84px}
  #prompt{left:16px;transform:none;bottom:calc(var(--sb) + 284px);max-width:calc(100% - 216px);padding-right:10px}#prompt b{font-size:16px;white-space:normal}#prompt small{white-space:normal}#prompt .ic{width:40px;height:40px}#prompt:active{transform:translateY(4px)}
  #thrN{display:none}#fiAN{display:none}#pactN{display:none}#combat{transform:scale(.88);transform-origin:100% 100%}#bar{transform:translateX(-50%) scale(.6);transform-origin:50% 100%}
  #top{gap:5px;padding:4px 6px}.num{font-size:15px}#sGold{min-width:0}.stat svg{width:18px;height:18px}
  #sLv{padding:0 5px;font-size:12px}#sLv b{font-size:15px}#sXp{display:none}
  #obj{font-size:13px}#camHint{right:24px;top:36%}
}

.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;
  background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:12px 14px 16px;pointer-events:auto;touch-action:pan-y;animation:card .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes card{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.sheet h4{margin:0;font-size:22px;font-weight:800;line-height:1.1}
.sheet h5{margin:12px 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--deep);display:flex;justify-content:space-between}
.x{width:38px;height:38px;flex:none;border-radius:12px;background:var(--paper2);border:3px solid var(--ink);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.row{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 8px;margin-bottom:7px}
.row .ico{width:36px;height:36px;flex:none;border-radius:10px;background:var(--paper2);display:grid;place-items:center}
.row .ico svg{width:28px;height:28px}
.row .nm{flex:1;min-width:0;line-height:1.15}
.row .nm b{display:block;font-size:15px;font-weight:800}
.row .nm small{font-size:12px;font-weight:700;color:#5d6475}
.row .q{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1;white-space:nowrap}
.row .q small{display:block;font-size:10px;color:#5d6475;letter-spacing:.04em}
.row.locked{opacity:.6}
.btn{background:var(--leaf);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:1px 10px;font-size:14px;font-weight:800;white-space:nowrap;color:#fff;text-shadow:0 1px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:var(--mute);opacity:.75;cursor:default}
.btn.gold{background:var(--gold)}.btn.no{background:var(--red)}.btn.soft{background:var(--paper2);color:var(--ink);text-shadow:none}.btn.sea{background:var(--sea)}
.big{width:100%;padding:6px;font-size:17px}
.note{font-size:12px;font-weight:700;color:#5d6475;margin:6px 2px 0}
.warn{background:#ffe1d8;border:3px solid var(--red);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;margin:6px 0}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.slot{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.slot svg{width:32px;height:32px}
.slot b{font-size:12px;font-weight:800;line-height:1.1}
.slot small{font-size:11px;font-weight:700;color:#5d6475}
.slot .n{position:absolute;top:3px;right:6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.slot.eq{background:#e3f6dc}.slot.lock{opacity:.45}
.slot button.btn{font-size:12px;padding:0 8px;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cap{height:12px;border-radius:6px;background:#dfd3b8;border:2px solid var(--ink);overflow:hidden;margin:2px 0 4px}
.cap i{display:block;height:100%;background:var(--sea)}
.loot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.loot span{display:flex;align-items:center;gap:3px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 8px 1px 3px;font-weight:800;font-size:14px}
.loot svg{width:22px;height:22px}
.loot .lost{opacity:.5;text-decoration:line-through}

#fishLayer{position:absolute;inset:0;pointer-events:auto}
#fishPanel{position:absolute;left:50%;bottom:calc(var(--sb) + 96px + var(--lift));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#fishMsg{font-size:22px;font-weight:800;text-align:center;white-space:nowrap}
#fishRing{width:112px;height:112px;border-radius:50%;border:5px solid var(--ink);background:var(--paper);display:grid;place-items:center;position:relative}
#fishRing::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:6px solid var(--gold);transform:scale(var(--k,1.8));opacity:var(--o,0)}
#fishRing b{font-size:28px;font-weight:800;color:var(--coral)}
#fishRing.hot{background:var(--gold);animation:pulse .3s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#fishCard,#result{text-align:center;width:min(320px,calc(100% - 32px))}
#fishCard .rar{display:inline-block;padding:2px 12px;border-radius:12px;border:2px solid var(--ink);font-weight:800;font-size:13px;color:#fff;letter-spacing:.06em}
#fishCard h3,#result h3{margin:6px 0 2px;font-size:28px;line-height:1.05;font-weight:800}
#fishCard .st{display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
#fishCard .fsvg{width:84px;height:84px;margin:0 auto}
#result p{margin:4px 0;font-weight:700;font-size:14px}
#bSail{font-size:15px;display:flex}#bSail.on{background:var(--gold)}
#bAds{width:auto;min-width:30px;padding:0 5px;gap:2px;display:flex;font-size:15px}#bAds small{font-size:10px;font-weight:800}#bAds.on{background:var(--gold)}
#adOffer{position:absolute;left:50%;top:calc(var(--st) + 112px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:5px 6px 5px 6px;pointer-events:auto;max-width:calc(100% - 32px);z-index:15;animation:card .2s ease-out}
#adOffer .ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--paper2);display:grid;place-items:center}#adOffer .ic svg{width:28px;height:28px}
#adOffer .tx{display:flex;flex-direction:column;line-height:1.1;min-width:0}#adOffer b{font-size:15px;font-weight:800}#adOffer small{font-size:12px;font-weight:700;color:#5d6475}
#adOffer .btn{font-size:14px;min-height:34px}
#adOffer.big{top:42%;padding:8px 10px;border-width:4px;box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(232,66,74,.35)}#adOffer.big b{font-size:19px;color:var(--red)}#adOffer.big .btn{font-size:16px;min-height:40px}#adOffer .x{width:32px;height:32px;font-size:15px}
#adPlay{position:fixed;inset:0;z-index:70;background:rgba(10,14,30,.92);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#adPlay .adBox{width:min(360px,80vw);background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px}
#adPlay em{font-style:normal;align-self:center;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:12px}
#adPlay .adBox>b{font-size:26px;font-weight:800}#adPlay small{font-size:12px;font-weight:700;color:#5d6475}
#adPlay .adBar{height:12px;border-radius:6px;background:#dfd3b8;border:2px solid var(--ink);overflow:hidden}#adPlay .adBar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .9s linear}
#adPlay span{font-weight:800;font-size:14px}
@media (max-height:500px){#adOffer.big{top:52%}#adOffer{top:calc(84px + env(safe-area-inset-top,0px));padding:3px 5px}#adOffer .ic{width:30px;height:30px}#adOffer b{font-size:13px}#adOffer small{font-size:11px}}
/* Yatay telefon (kısa ekran): paneller sağdan açılan yarım genişlik yan panel, sol tarafta oyun görünür kalır */
@media (max-height:500px){
  .sheet{left:auto;right:calc(8px + env(safe-area-inset-right,0px));top:8px;bottom:8px;transform:none;width:min(400px,54vw);max-height:none;padding:8px 10px 10px;border-width:3px;border-radius:16px;box-shadow:0 4px 0 var(--ink);animation:slideIn .2s ease-out}
  #fishCard,#result{width:min(340px,54vw);bottom:auto;max-height:calc(100% - 16px)}
  .sheet h4{font-size:18px}.sheet h5{margin:8px 0 4px;font-size:11px}.sheet header{margin-bottom:2px}
  .x{width:32px;height:32px;font-size:15px;border-radius:10px}
  .row{padding:3px 6px;margin-bottom:5px;border-width:2px;border-radius:11px;gap:6px}
  .row .ico{width:28px;height:28px}.row .ico svg{width:22px;height:22px}
  .row .nm b{font-size:13px}.row .nm small{font-size:11px}.row .q{font-size:13px}
  .btn{font-size:12px;padding:0 8px;border-width:2px;border-radius:10px}.row .btn{min-height:30px}.big{font-size:14px;padding:4px}
  .stats{font-size:12px}.note{font-size:11px}.inv{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}.slot svg{width:26px;height:26px}
  #fishCard h3,#result h3{font-size:22px}
  #top{top:calc(4px + env(safe-area-inset-top,0px));width:auto;max-width:calc(100% - 24px);gap:6px;padding:2px 6px;border-width:2px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
  #top .bar{height:14px}#sHp{width:120px;flex:none}#sXp{width:110px;flex:none}.stat svg{width:16px;height:16px}.num{font-size:14px}#sGold{min-width:0}#sBag{font-size:13px}
  #sLv{height:20px;font-size:11px;padding:0 5px;border-radius:7px}#sLv b{font-size:13px}.tb{width:24px;height:24px;border-radius:7px}.tb svg{width:16px;height:16px}#thr{height:24px;font-size:11px;padding:0 6px}
  #obj{top:calc(36px + env(safe-area-inset-top,0px));font-size:11px;padding:1px 9px;border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--ink);max-width:min(440px,60%);opacity:.92}#obj em{font-size:9px}
  #alert{top:calc(58px + env(safe-area-inset-top,0px));font-size:10px;padding:0 9px;border-width:2px;border-radius:10px;max-width:min(420px,58%)}#alert em{font-size:9px}
  #toasts{top:calc(80px + env(safe-area-inset-top,0px))}.toast{font-size:12px;padding:3px 10px}#saved{top:calc(36px + env(safe-area-inset-top,0px))}
  #banner{top:22%}
  #fiA,#pactC{height:24px;font-size:11px;padding:0 6px}#pactN{display:none}
  #bar{transform:translateX(-50%) scale(.6);transform-origin:50% 100%;bottom:calc(var(--sb) - 4px)}
  #prompt{bottom:calc(var(--sb) + 50px);padding:3px 14px 3px 3px;gap:7px}#prompt .ic{width:36px;height:36px}#prompt .ic svg{width:22px;height:22px}#prompt b{font-size:16px}#prompt small{font-size:11px}
}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
#rotate{position:fixed;inset:0;z-index:60;background:#16707F;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;pointer-events:auto;padding:24px}
#rotate .rb2{display:flex;flex-direction:column;align-items:center;gap:14px}
#rotate svg{width:110px;height:110px;animation:rot 2.2s ease-in-out infinite}
#rotate b{font-size:28px;font-weight:800;line-height:1.1}#rotate small{font-size:15px;font-weight:700;opacity:.9}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
</style>

    if (!a) { a = { bolt: !!o.bolt, m: mesh(o.bolt ? this.geoB : this.geoA, o.bolt ? this.matB : woodM, false) }; scene.add(a.m); this.pool.push(a); }
    const tp = tgt ? { x: tgt.o.x, z: tgt.o.z, y: tgt.kind === 'ship' ? 1.2 * tgt.o.size : (tgt.o.y || 0.6) + 1.1 } : o.point;

  update(dt) {

      if (T && !o.miss && T.kind === 'struct') { EnemyIsland.hitWh(o.dmg * 0.6); continue; }
      if (T && !o.miss && T.kind === 'pirate' && T.o.alive && hyp(T.o.x - x, T.o.z - z) < 1.8) { T.o.hit(o.dmg, { big: o.crit, from: { x: a.fx, z: a.fz } }); if (o.crit) floatText('CRIT', x, y + 1.3, z, 'big'); }

      else { const wet = !isWalkable(x, z); burst(x, wet ? 0.2 : groundY(x, z) + 0.1, z, 5, wet ? '#E8FBFF' : '#E8D4A8', 2, 0.08, 10, 0.4); if (o.miss) floatText('Miss', x, 1.5, z, 'info'); }
    }
  },
};

/* ---------- BowSystem: Level 10 + 2 görev ---------- */
const Bow = {
  cd: 0,
  fire() {
    const B = PROG.bow;

    if (P.state === 'dead' || P.state === 'hop' || Fishing.active || panelOpen() || game.mode === 'trans' || !(onFoot() || game.mode === 'sea')) return;
    if (this.cd > 0 || P.atk) return;
    if (G.bag.arrow <= 0) { if (Ads.offer('arrows')) return; toast('No arrows · craft at the Warehouse Workshop or take from storage'); SFX.play('error'); return; }
    P.h.root.getWorldPosition(_v); const from = { x: _v.x, y: _v.y + 1.45, z: _v.z };
    let tgt = null;
    if (onFoot()) { const pt = playerTarget(); if (pt && hyp(pt.x - from.x, pt.z - from.z) < B.range) tgt = { kind: 'pirate', o: pt };
      else { let bd = B.range; for (const e of PIRATES) if (e.alive && !e.onRaft && !e.hopping && e.h.root.visible) { const d = hyp(e.x - from.x, e.z - from.z); if (d < bd) { bd = d; tgt = { kind: 'pirate', o: e }; } } } }
    if (!tgt && onFoot() && EnemyIsland.wh.alive && hyp(EWH.x - from.x, EWH.z - from.z) < B.range) tgt = { kind: 'struct', o: EnemyIsland.wh };
    if (!tgt && game.mode !== 'deck') { let bd = B.shipRange; for (const es of ESHIPS) if (es.present && !(es.neutral && !Center.hostile())) { const d = hyp(es.x - from.x, es.z - from.z); if (d < bd) { bd = d; tgt = { kind: 'ship', o: es }; } } }
    if (!tgt && game.mode !== 'deck') tgt = Harbors.pickDef(from.x, from.z, B.shipRange);
    const swim = SwimSystem.inWater;
    const ax = tgt ? tgt.o.x : from.x + Math.sin(P.facing) * B.range, az = tgt ? tgt.o.z : from.z + Math.cos(P.facing) * B.range;
    if (game.mode === 'sea') { const lp = boat.tilt.worldToLocal(new THREE.Vector3(ax, 0.43, az)); P.h.root.rotation.y = Math.atan2(lp.x - boat.helm.x, lp.z - boat.helm.z); }
    else { endTask(); P.facing = Math.atan2(ax - from.x, az - from.z); }
    this.cd = B.cd * (swim ? B.swimCdMul : 1); G.bag.arrow--; G.stats.arrows = (G.stats.arrows || 0) + 1; updateHUD(); markDirty();
    P.atk = 'bow'; P.h.setTool('bow'); SFX.play('bow');
    const crit = Math.random() < B.crit, miss = swim && Math.random() < B.swimMiss;
    const dmg = Math.round(playerDmg() * B.dmgMul * (crit ? B.critMul : 1));
    const shipDmg = Math.round(B.shipDmg * (1 + P.level * 0.05) * (tgt && tgt.kind === 'ship' && tgt.o.cfg.heavy ? 0.5 : 1));
    P.h.play('SHOOT', { dur: swim ? 0.7 : 0.5, hitAt: 0.6, onHit: () => { P.h.root.getWorldPosition(_v); ArrowSystem.shoot({ x: _v.x, y: _v.y + 1.45, z: _v.z }, tgt, { dmg, crit, miss, shipDmg, point: { x: ax, y: 0.3, z: az } }); }, onEnd: () => { if (P.atk === 'bow') P.atk = null; P.h.setTool('sword'); } });
    if (!tgt) floatText('No target in range', from.x, from.y + 1.2, from.z, 'info');
  },

/* ---------- SwimmingSystem: denize girilebilir, HP azalır ---------- */
const SwimSystem = {
  inWater: false, depth: '', warned: false, hudT: 0,
  canSwim(x, z) { if (hyp(x - ISL.cx, z - ISL.cz) > PROG.swim.maxR) return false; for (const es of ESHIPS) if (es.present && hyp(x - es.x, z - es.z) < 1.6 * es.size + 0.6) return false; return !Fleet.blocks(x, z, 0.6); },
  walk(x, z) { return isWalkable(x, z) || (game.mode === 'land' && SwimSystem.canSwim(x, z)); },
  update(dt) {
    const was = this.inWater;
    this.inWater = game.mode === 'land' && P.state !== 'hop' && P.state !== 'ship' && P.state !== 'dead' && !isWalkable(P.x, P.z);
    if (!this.inWater) { if (was && P.h.is('SWIM')) P.h.stop(); if (was) this.warned = false; return; }
    const shallow = onIsland(P.x, P.z, -4); this.depth = shallow ? 'shallow' : 'deep';
    if (!this.warned) { this.warned = true; toast('You are in the sea! HP is draining · swim to shore'); SFX.play('splash'); endTask(); }
    P.hp -= (shallow ? PROG.swim.shallowDrain : PROG.swim.deepDrain) * dt; P.lastHurt = 0;
    if (P.hp <= 0) { P.hp = 0.5; hurtPlayer(5); return; }
    this.hudT -= dt; if (this.hudT <= 0) { this.hudT = 0.25; updateHUD(); }
    if (!P.atk && !P.h.action) P.h.play('SWIM');
    if (P.spd > 0.6 && Math.random() < dt * 6) spawnWake(P.x, P.z, 0.35, 1);
  },
};

/* ---------- DroneSystem: tespit, hedef, saldırı, dönüş, şarj ---------- */
const Drone = (() => {

  const a1 = box(1.6, 0.06, 0.12, inkM, 0, 0.02, 0, false); a1.rotation.y = Math.PI / 4; const a2 = box(1.6, 0.06, 0.12, inkM, 0, 0.02, 0, false); a2.rotation.y = -Math.PI / 4; g.add(a1, a2);
  const rotM = new THREE.MeshBasicMaterial({ color: '#dfe6ee', transparent: true, opacity: 0.6, depthWrite: false });
  const rotors = [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([sx, sz]) => { const r = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.02, 14), rotM, false); r.position.set(sx * 0.56, 0.1, sz * 0.56); g.add(r); return r; });
  const eye = mesh(new THREE.SphereGeometry(0.1, 8, 6), new THREE.MeshBasicMaterial({ color: '#ff3b3b' }), false); eye.position.set(0, -0.1, 0.36); g.add(eye);
  g.visible = false; scene.add(g);

  D.cfg = () => PROG.drone.levels[G.drone.lv] || PROG.drone.levels[1];
  D.detecting = () => G.drone.owned && (D.state === 'escort' || D.state === 'attack' || D.state === 'return');
  D.pickTarget = () => {
    const c = D.cfg(), ox = P.wx, oz = P.wz; const pt = onFoot() ? playerTarget() : null;
    if (pt && hyp(pt.x - ox, pt.z - oz) < c.range) return { kind: 'pirate', o: pt };
    let best = null, bd = c.range;
    if (game.mode !== 'deck') for (const es of ESHIPS) if (es.present && !(es.neutral && !Center.hostile())) { const d = hyp(es.x - ox, es.z - oz); if (d < bd) { bd = d; best = { kind: 'ship', o: es }; } }
    if (best) return best; bd = c.range;
    for (const e of PIRATES) if (e.alive && !e.onRaft && e.h.root.visible) { const d = hyp(e.x - ox, e.z - oz); if (d < bd) { bd = d; best = { kind: 'pirate', o: e }; } }
    return best;
  };
  // Otomatik hedef: karadayken oyuncuya en yakın korsan (önce oyuncunun hedefi), denizde önce gemiler
  D.autoPick = () => {
    const c = D.cfg(), ox = P.wx, oz = P.wz, pt = onFoot() ? playerTarget() : null;
    if (pt && hyp(pt.x - ox, pt.z - oz) < c.range) return { kind: 'pirate', o: pt };
    let best = null, bd = c.range;
    const pir = () => { for (const e of PIRATES) if (e.alive && !e.onRaft && !e.hopping && e.h.root.visible && e.kind !== 'deck' === (game.mode !== 'deck')) { const d = hyp(e.x - ox, e.z - oz); if (d < bd) { bd = d; best = { kind: 'pirate', o: e }; } } };
    const shp = () => { if (game.mode !== 'deck') for (const es of ESHIPS) if (es.present && !(es.neutral && !Center.hostile())) { const d = hyp(es.x - ox, es.z - oz); if (d < bd) { bd = d; best = { kind: 'ship', o: es }; } } };
    if (game.mode === 'sea') { shp(); if (!best) pir(); } else { pir(); if (!best) shp(); }
    return best;
  };
  D.engage = tg => { if (D.target && D.target.o === tg.o && D.state === 'attack') return; D.target = tg; D.state = 'attack'; D.lock = 0; D.shotT = 0; floatText('🎯 ' + (tg.kind === 'ship' ? tg.o.cfg.n : tg.o.name), tg.o.x, tg.kind === 'ship' ? 4 * tg.o.size : (tg.o.y || 0.6) + 3, tg.o.z, 'info'); };
  D.press = () => {
    if (!G.drone.owned) { toast(P.level < PROG.drone.level ? '🚁 DRONE unlocks at Level ' + PROG.drone.level + ' · you are Level ' + P.level : '🚁 ' + questLine('drone')); SFX.play('error'); return; }

    D.state = 'return'; toast('Drone recalled');
  };
  D.hurt = n => {
    if (G.drone.destroyed) return; G.drone.hp -= n; if (Math.random() < 0.08) burst(D.x, D.y, D.z, 2, '#FFB03B', 2, 0.08, 4, 0.3);
    if (G.drone.hp <= 0) { G.drone.hp = 0; G.drone.destroyed = true; D.state = 'destroyed'; g.visible = false; burst(D.x, D.y, D.z, 24, '#FF6A3D', 6, 0.16); SFX.play('slam'); banner('DRONE DOWN', 'Repair at the Warehouse Workshop', true); markDirty(); }
  };
  D.update = (dt, t) => {

const Goals = {
  pool: [
    { id: 'kill', t: n => n + ' pirate kills', stat: 'kills', n: [5, 8, 12] },
    { id: 'fish', t: n => n + ' fish caught', stat: 'caught', n: [5, 8] },

    { id: 'board', t: n => n + ' ships captured', stat: 'captures', n: [1, 2], need: () => P.level >= 3 },

    { id: 'deposit', t: n => n + ' items stored', stat: 'deposited', n: [15, 30] },
  ],
  chainDone() { return objective().startsWith('All goals'); },
  assign() {
    const opts = this.pool.filter(g => (!g.need || g.need()) && (!G.goal || g.id !== G.goal.id)), g = opts[randi(0, opts.length - 1)], n = g.n[randi(0, g.n.length - 1)];
    G.goal = { id: g.id, n, base: G.stats[g.stat] || 0 }; markDirty();
  },
  def() { return G.goal && this.pool.find(g => g.id === G.goal.id); },
  reward() { return { gold: 50 + 20 * P.level, xp: Math.round(ECON.xpNeed(P.level) * 0.12) }; },
  short() {

  },
  mid() {

    if (L < PROG.drone.level) return 'Level ' + PROG.drone.level + ' → 🚁 DRONE quests unlock (now ' + L + ')';
    if (L >= KENDO.hub.level && !G.stats.hubVisit) return 'Go to Central Island: bridge gates open in open hours (Level ' + KENDO.hub.level + '+)';
    if (!G.towers.length && L >= 6) return 'Tap a soldier → BUILD: have a defense tower built (' + costStr(Towers.cost) + ')';
    return 'Max out your outfit and soldiers';
  },
  long() {
    const s = G.stats;
    if (!s.armored) return 'Capture an Armored Ship Lv 15 (Shipyard: boat, Barracks: soldiers)';
    if (G.drone.owned && G.drone.lv < 5) return 'Get the drone to Level 5 → full damage to heavy ships (now Lv ' + G.drone.lv + ')';
    if (!s.elite) return 'Capture the Elite Warship Lv 25';
    if (!s.invasion) return 'Repel an attack wave at Invasion threat (threat ≥ 85)';
    if (G.sword < 5 || !G.outfit || G.outfits[G.outfit] < 3) return 'Get Sword Lv 5 and your worn outfit to Lv 3';
    if (!G.weapons.bokuto) return 'Chop Bokuto Trees: ~1 in 20 drops the glowing BOKUTO (' + (G.bokutoN || 0) + ' kesildi)';
    if (!G.outfits.doo) return 'Get the legendary DOO costume at the Central Armory (Level 25 · steel + seals)';
    if (!s.hubRaid) return 'Raid the Central Storehouse: defeat all fort warriors → supplies come to you';
    { const hg = Harbors.goal(); if (hg && (L >= 10 || Harbors.won[2])) return hg; }
    if (!G.weapons.akex) return 'Sail to distant Bastion Island and hunt Crimson Rex for the rare AKEX (' + (G.akexN || 0) + ' defeated)';
    if (Forge.owned().length < Forge.fac.length) return 'Capture Forge Island facilities (' + Forge.owned().length + '/' + Forge.fac.length + ') · cross the Forge Bridge behind Central Island';

  sel: null, group: false, rings: [], hl: null,
  label(e) { const o = e.ord && ORDER_DEF[e.ord.t]; if (o && e.ord.t !== 'follow') return o.tr; return e.follow ? 'Following' : 'At barracks'; },
  canFollow(n) { return G.crew.filter(e => e.follow).length + n <= boatCfg().crew; },
  saveOrd(e) { const o = e.ord; if (!o || o.t === 'attack' || o.t === 'follow') return null; return { t: o.t, x: o.x, z: o.z, f: o.f, site: o.site }; },
  initUI() {
    const ring = $('#cmdRing');
    CMD_ORDER.forEach((k, i) => { const a = i / 8 * TAU, d = ORDER_DEF[k], b = document.createElement('button'); b.className = 'cmdB'; b.dataset.o = k; b.style.setProperty('--c', d.col); b.style.left = Math.round(Math.sin(a) * 94) + 'px'; b.style.top = Math.round(-Math.cos(a) * 94) + 'px'; b.innerHTML = `<b>${d.n}</b><small>${d.tr}</small>`; ring.appendChild(b); });
    const c = document.createElement('button'); c.id = 'cmdC'; c.innerHTML = '<b id="cmdN"></b><small id="cmdS"></small><em id="cmdG"></em>'; ring.appendChild(c);
    $('#cmd').addEventListener('pointerdown', e => { if (e.target === $('#cmd')) { e.preventDefault(); this.close(); } });
    ring.addEventListener('click', e => { const b = e.target.closest('.cmdB'); if (b) { this.give(b.dataset.o); return; } if (e.target.closest('#cmdC')) { this.group = !this.group; SFX.play('knock'); this.render(); } });
    this.hl = mesh(new THREE.RingGeometry(0.62, 0.8, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#4FAE45', transparent: true, opacity: 0.9, depthWrite: false }), false); this.hl.visible = false; this.hl.renderOrder = 6; scene.add(this.hl);
  },
  pick(sx, sy) { let b = null, bd = 46; for (const t of TROOPS) if (t.alive && !t.onBoat && !t.onDeck && !t.hopping && t.h.root.visible) { for (const y of [0.5, 1.2]) { const s = toScreen(t.x, t.y + y, t.z); if (!s.vis) continue; const d = hyp(s.x - sx, s.y - sy); if (d < bd) { bd = d; b = t; } } } return b; },
  tap(sx, sy) { if (game.mode !== 'land' || P.state === 'dead') return false; const t = this.pick(sx, sy); if (!t) return false; this.open(t, sx, sy); return true; },
  open(t, sx, sy) {
    closePanels(); this.sel = t; this.group = false; const R = 130, ring = $('#cmdRing');
    ring.style.left = clamp(sx, R, innerWidth - R) + 'px'; ring.style.top = clamp(portrait() ? Math.min(sy, innerHeight * 0.48) : sy, R + 40, Math.max(R + 40, innerHeight - R)) + 'px';
    this.render(); $('#cmd').hidden = false; SFX.play('knock');
  },
  close() { $('#cmd').hidden = true; this.sel = null; if (this.hl) this.hl.visible = false; },
  targets() { return this.group ? TROOPS.filter(t => t.alive && !t.onBoat && !t.onDeck) : (this.sel ? [this.sel] : []); },
  render() {
    const t = this.sel; if (!t) return; const e = t.e, list = this.targets();
    $('#cmdN').textContent = this.group ? 'GROUP' : t.name; $('#cmdS').textContent = this.group ? list.length + ' soldiers' : 'Lv ' + e.lv + ' · ' + this.label(e);
    $('#cmdG').textContent = this.group ? 'ONE SOLDIER ↺' : 'GROUP ↺';
    const cur = e.ord ? e.ord.t : e.follow ? 'follow' : '';
    for (const b of document.querySelectorAll('.cmdB')) { const k = b.dataset.o; b.classList.toggle('on', !this.group && k === cur);
      const needF = ORDER_DEF[k].follow && list.some(q => !q.e.follow) && !this.canFollow(1); b.disabled = needF || (k === 'build' && Towers.siteFor(t) == null); }
  },
  give(kind) {
    const def = ORDER_DEF[kind], sel = this.sel, list = this.targets(); if (!sel || !list.length) { this.close(); return; }
    let tgt = null, site = null;
    if (kind === 'attack') { tgt = playerTarget() || nearestFoe(sel.x, sel.z, 20); if (!tgt) { toast('No enemies nearby · pick a target first'); SFX.play('error'); return; } }
    if (kind === 'build') { site = Towers.siteFor(sel); if (site == null) { toast('All tower spots are taken'); SFX.play('error'); return; } if (!Towers.pay(site)) return; }
    if (kind === 'ship') ShipBuild.ensure();
    let refused = 0; const names = [];
    for (const t of list) { const e = t.e;
      if (def.follow && !e.follow && !this.canFollow(1)) { refused++; continue; }
      e.follow = def.follow; t.st.path = null;
      if (kind === 'follow') e.ord = null;
      else if (kind === 'stay') e.ord = { t: 'stay', x: t.x, z: t.z, f: t.facing };
      else if (kind === 'defend') e.ord = { t: 'defend', x: sel.x, z: sel.z };
      else if (kind === 'attack') e.ord = { t: 'attack', target: tgt };
      else if (kind === 'build') e.ord = { t: 'build', site };
      else e.ord = { t: kind };
      names.push(t.name);
    }
    if (names.length) { toast(names.join(', ') + ' → ' + def.n + ' · ' + def.tr + (refused ? ' · ' + refused + ' soldiers: follow capacity full' : '')); SFX.play('buy'); }
    else { toast('Follow capacity full (' + boatCfg().crew + ') · upgrade your boat'); SFX.play('error'); }
    if (kind === 'defend') floatText('Defense area', sel.x, sel.y + 2.6, sel.z, 'info');
    if (kind === 'board') floatText('+25% boarding damage', sel.x, sel.y + 2.6, sel.z, 'info');
    markDirty(); this.close();
  },
  // Troop.update içinden çağrılır; görev hareketi burada yönetilirse true döner
  update(t, dt) {
    const o = t.e.ord; if (!o || o.t === 'follow' || o.t === 'board' || game.mode === 'deck' || t.onDeck) return false;
    const pmax = CFG.moveSpeed * 1.15;
    const fight = tg => { const d = dist(t, tg); if (d < 1.8) { t.faceTo = Math.atan2(tg.x - t.x, tg.z - t.z); if (t.cd <= 0) { t.cd = rand(1.0, 1.3); t.h.play('ATTACK', { onHit: () => { if (tg.alive && dist(t, tg) < 2.5) tg.hit(t.dmg(), { from: t }); } }); } return ZERO; } const a = t.idx * 1.3; return steerTo(t, t.st, tg.x + Math.sin(a) * 1.2, tg.z + Math.cos(a) * 1.2, 0.3, pmax, dt) || ZERO; };
    let v = ZERO;
    if (o.t === 'protect') {
      if (game.mode !== 'land' || P.state === 'dead') return false;
      const tg = nearestFoe(P.x, P.z, 7);
      if (tg) v = fight(tg);
      else { const a = t.idx * 2.1 + P.facing + Math.PI; let sx = P.x + Math.sin(a) * 1.3, sz = P.z + Math.cos(a) * 1.3; if (!isWalkable(sx, sz) || collides(sx, sz, 0.3)) { sx = P.x; sz = P.z; } v = steerTo(t, t.st, sx, sz, sx === P.x ? 1.2 : 0.25, pmax * 1.05, dt) || ZERO; if (dist(t, P) > 24 && isWalkable(P.x, P.z)) { t.x = P.x; t.z = P.z; t.st.path = null; } }
    } else if (o.t === 'attack') {
      let tg = o.target; if (!tg || !tg.alive || !PIRATES.includes(tg)) tg = o.target = nearestFoe(t.x, t.z, 14);
      if (!tg) { t.e.ord = null; t.e.follow = t.e.follow || this.canFollow(1); floatText('Area clear', t.x, t.y + 2.4, t.z, 'info'); return false; }
      v = fight(tg);
    } else if (o.t === 'stay' || o.t === 'defend') {
      const def = o.t === 'defend', R = def ? 10 : 4.5, tg = nearestFoe(o.x, o.z, R);
      if (tg && hyp(t.x - o.x, t.z - o.z) < R + 3.5) v = fight(tg);
      else { const ox = def ? Math.sin(t.idx * 2.4) * 1.6 : 0, oz = def ? Math.cos(t.idx * 2.4) * 1.6 : 0; v = steerTo(t, t.st, o.x + ox, o.z + oz, 0.3, pmax * 0.85, dt) || ZERO; if (v === ZERO && o.f != null) t.faceTo = o.f; }
    } else if (o.t === 'build') v = Towers.work(t, o, dt);
    else if (o.t === 'ship') v = ShipBuild.work(t, o, dt);
    else return false;
    agentStep(t, v, dt, 9); return true;
  },
  updateFx(dt, t) {
    if (!$('#cmd').hidden && (!this.sel || !this.sel.alive || game.mode !== 'land' || this.sel.onBoat)) this.close();
    if (this.sel && !$('#cmd').hidden) { const s = this.sel; this.hl.visible = true; this.hl.position.set(s.x, s.y + 0.06, s.z); this.hl.scale.setScalar(1 + Math.sin(t * 6) * 0.08); }
    let ri = 0; const seen = new Set();
    for (const tr of TROOPS) { const o = tr.e.ord; if (!o || !tr.alive || o.t !== 'defend') continue; const k = Math.round(o.x) + ',' + Math.round(o.z); if (seen.has(k)) continue; seen.add(k);
      let m = this.rings[ri]; if (!m) { m = mesh(new THREE.RingGeometry(0.95, 1, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#3E8E5A', transparent: true, opacity: 0.35, depthWrite: false }), false); m.renderOrder = 5; scene.add(m); this.rings[ri] = m; } ri++;

  worldUI(show) { for (const t of TROOPS) { const o = t.e.ord; if (!o || o.t === 'follow' || !t.alive || t.onBoat || hyp(t.x - camT.x, t.z - camT.z) > 26) continue; show(t, 'ally', t.name, ORDER_DEF[o.t].n, t.hp / t.maxHp, t.y + 2.4); } },
};

/* ---------- DefenseTowerSystem: askerler kaynak harcayıp savunma kulesi inşa eder ---------- */
const Towers = {
  cost: { gold: 300, wood: 30, iron: 12 }, time: 16, sites: [],
  init() { this.sites = TOWER_SITES.filter(s => isWalkable(s.x, s.z) && onIsland(s.x, s.z, 1.5) && !collides(s.x, s.z, 1.4)).map(s => Object.assign(s, { built: false, paid: false, p: 0, cd: rand(0, 1) })); },
  siteFor(t) { let best = null, bd = 1e9; this.sites.forEach((s, i) => { if (s.built) return; const d = hyp(s.x - t.x, s.z - t.z) - (s.paid ? 1000 : 0); if (d < bd) { bd = d; best = i; } }); return best; },
  pay(i) { const s = this.sites[i]; if (s.paid) return true; if (!canPay(this.cost)) { toast('Defense tower needs: ' + costStr(this.cost) + ' (warehouse + bag)'); SFX.play('error'); return false; } payCost(this.cost); s.paid = true; this.scaffold(s); updateHUD(); markDirty(); toast('🏗 Tower site: ' + s.n + ' · ' + costStr(this.cost) + ' spent'); return true; },
  scaffold(s) { if (s.sc) return; const g = new THREE.Group(); for (const [x, z] of [[-0.9, -0.9], [0.9, -0.9], [-0.9, 0.9], [0.9, 0.9]]) g.add(box(0.14, 3.2, 0.14, '#B98552', x, 1.6, z)); for (let y = 0.8; y < 3.2; y += 0.8) g.add(box(2, 0.1, 0.1, '#8B5A34', 0, y, -0.9), box(2, 0.1, 0.1, '#8B5A34', 0, y, 0.9)); g.position.set(s.x, groundY(s.x, s.z), s.z); g.scale.y = 0.05 + 0.95 * s.p; scene.add(g); s.sc = g; },
  work(t, o, dt) {
    const s = this.sites[o.site]; if (!s || s.built) { t.e.ord = null; t.e.follow = this.canFollowAfter(); return ZERO; }
    const a = t.idx * 1.9, wx = s.x + Math.sin(a) * 2.1, wz = s.z + Math.cos(a) * 2.1;
    const v = steerTo(t, t.st, isWalkable(wx, wz) ? wx : s.x, isWalkable(wx, wz) ? wz : s.z + 2, 0.4, CFG.moveSpeed * 1.1, dt); if (v) return v;
    t.faceTo = Math.atan2(s.x - t.x, s.z - t.z);
    if (!s.paid && !this.pay(o.site)) { t.e.ord = { t: 'stay', x: t.x, z: t.z }; return ZERO; }
    if (t.cd <= 0) { t.cd = 0.75; t.h.play('ATTACK'); burst(s.x + rand(-1, 1), groundY(s.x, s.z) + rand(0.5, 3) * (s.p + 0.2), s.z + rand(-1, 1), 3, '#E8D4A8', 2, 0.08); if (hyp(s.x - camT.x, s.z - camT.z) < 30) SFX.play('knock'); }

    return ZERO;
  },
  canFollowAfter() { return Orders.canFollow(1); },
  complete(i, silent) {
    const s = this.sites[i]; if (!s || s.built) return; s.built = true; s.paid = true; s.p = 1; if (s.sc) { scene.remove(s.sc); s.sc = null; }
    const g = makeWatchTower(); g.children[g.children.length - 1].visible = false; g.add(box(0.6, 0.35, 0.03, '#1FA3B5', 1.2, 4.75, 0.9, false)); place(g, s.x, s.z, 0); freeze(g); s.mesh = g; s.hp = 400;
    s.col = addCol(s.x, s.z, 1.3); regridArea(s.x, s.z, 3);
    s.archer = new Humanoid({ shirt: '#1E7F86', pants: '#2a3550', hat: 'helmet', hatColor: '#AEB8C4', weapon: 'bow', tools: ['bow'] }); s.archer.root.position.set(s.x, groundY(s.x, s.z) + 3.25, s.z);
    if (!G.towers.includes(i)) G.towers.push(i);
    for (const tr of TROOPS) if (tr.e.ord && tr.e.ord.t === 'build' && tr.e.ord.site === i) { tr.e.ord = null; tr.e.follow = Orders.canFollow(1); }
    if (!silent) { banner('DEFENSE TOWER', s.n + ' · archer on guard'); SFX.play('level'); burst(s.x, 4, s.z, 24, '#FFC53D', 5, 0.14); G.stats.towers = (G.stats.towers || 0) + 1; markDirty(); }
  },
  update(dt) {
    for (const s of this.sites) {
      if (!s.built) continue; s.cd -= dt; s.archer.update(dt, 0); if (s.cd > 0) continue;
      let tg = null, bd = 15; for (const p of PIRATES) if (p.alive && !p.hopping && p.h.root.visible && p.kind !== 'deck') { const d = hyp(p.x - s.x, p.z - s.z); if (d < bd) { bd = d; tg = p; } }
      if (!tg) { s.cd = 0.5; continue; } s.cd = 1.7; s.archer.root.rotation.y = Math.atan2(tg.x - s.x, tg.z - s.z); s.archer.play('SHOOT', { dur: 0.5 });
      ArrowSystem.shoot({ x: s.x, y: groundY(s.x, s.z) + 4.6, z: s.z }, { kind: 'pirate', o: tg }, { dmg: Math.round(10 + 3 * P.level), crit: false, miss: Math.random() < 0.1, shipDmg: 0 });
    }
  },
  worldUI(show) { for (const s of this.sites) if (s.paid && !s.built && hyp(s.x - camT.x, s.z - camT.z) < 40) { const n = TROOPS.filter(t => t.e.ord && t.e.ord.t === 'build' && t.e.ord.site === this.sites.indexOf(s)).length; show(s, 'yard', 'TOWER BUILD', '', Math.min(1, s.p), 4.6, n ? n + ' soldiers working' : 'Tap a soldier → BUILD'); } },
};

/* ---------- ShipBuildSystem: SHIP komutlu askerler Shipyard'da yeni gemi inşa eder ---------- */
const ShipBuild = {
  cost: { gold: 1500, wood: 60, iron: 25 }, workSec: 45,
  ensure() {
    if (G.shipProj) return true;
    if (Fleet.list.length >= PROG.fleet.max) { toast('Harbor dock full (' + PROG.fleet.max + ' ships) · salvage one first'); SFX.play('error'); return false; }
    if (!canPay(this.cost)) { toast('Fort Sloop needs: ' + costStr(this.cost) + ' (warehouse + bag)'); SFX.play('error'); return false; }
    payCost(this.cost); G.shipProj = { p: 0 }; toast('⚓ Fort Sloop construction started · soldiers with SHIP work at the Shipyard'); markDirty(); updateHUD(); return true;
  },
  helpers() { return TROOPS.filter(t => t.alive && t.e.ord && t.e.ord.t === 'ship' && hyp(t.x - YARD.x, t.z - YARD.z) < 6).length; },
  work(t, o, dt) {
    const base = Math.atan2(YARD_DOOR.x - YARD.x, YARD_DOOR.z - YARD.z), a = base + ((t.idx % 5) - 2) * 0.5; let wx = YARD.x + Math.sin(a) * 3.7, wz = YARD.z + Math.cos(a) * 3.7;
    if (!isWalkable(wx, wz) || collides(wx, wz, 0.3)) { wx = YARD_DOOR.x; wz = YARD_DOOR.z; }
    const v = steerTo(t, t.st, wx, wz, 0.4, CFG.moveSpeed * 1.1, dt); if (v) return v;
    t.faceTo = Math.atan2(YARD.x - t.x, YARD.z - t.z); if (!G.shipProj) return ZERO;
    if (t.cd <= 0) { t.cd = 0.8; t.h.play('ATTACK'); burst(YARD.x + rand(-1.5, 1.5), groundY(YARD.x, YARD.z) + rand(0.5, 2), YARD.z + rand(-1.5, 1.5), 3, '#E8D4A8', 2, 0.08); if (hyp(YARD.x - camT.x, YARD.z - camT.z) < 30) SFX.play('knock'); }
    G.shipProj.p += dt / this.workSec; if (G.shipProj.p >= 1) this.complete();
    return ZERO;
  },
  complete() {
    G.shipProj = null;
    if (Fleet.list.length >= PROG.fleet.max) { for (const [k, v] of Object.entries(this.cost)) { if (k === 'gold') G.gold += v; else G.depot[k] += v; } toast('Dock full · materials refunded'); }
    else { const b = Fleet.berth(Fleet.list.length); Fleet.add('sloop', b.x, b.z, b.h, {}, true); banner('FORT SLOOP BUILT', 'Shipyard › Fleet › "Use" to set sail'); SFX.play('level'); burst(b.x, 3, b.z, 30, '#FFC53D', 6, 0.15); G.stats.built = (G.stats.built || 0) + 1; }
    for (const tr of TROOPS) if (tr.e.ord && tr.e.ord.t === 'ship') { tr.e.ord = null; tr.e.follow = Orders.canFollow(1); }
    markDirty(); updateHUD();
  },
  html() {
    let h = `<h5><span>SHIPBUILDING</span><span>BY SOLDIERS</span></h5>`;
    if (G.shipProj) h += row(ico('i-hammer'), 'Fort Sloop · %' + Math.round(G.shipProj.p * 100), this.helpers() + ' soldiers working · tap a soldier → SHIP', '');
    else h += row(ico('i-hammer'), 'Build Fort Sloop', 'HP 520 · Cargo 120 · 5 soldiers · cannons<br>' + costStr(this.cost), `<button class="btn" data-sbuild ${canPay(this.cost) && Fleet.list.length < PROG.fleet.max ? '' : 'disabled'}>Start</button>`);
    return h + `<p class="note">Construction progresses while soldiers with the SHIP order work at the Shipyard (1 soldier ~${this.workSec} s; more soldiers are faster).</p>`;
  },
  worldUI(show) { if (G.shipProj && hyp(YARD.x - camT.x, YARD.z - camT.z) < 45) { const n = this.helpers(); show(YARD, 'yard', 'SHIPBUILDING', '', G.shipProj.p, 7.5, n ? n + ' soldiers working' : 'Tap a soldier → SHIP'); } },
};

/* ---------- DronePowerShotSystem: maks 5 güçlü mermi, atış arası bekleme, mermi başına dolum ---------- */
const PowerShot = {
  cd: 0, shots: [], geo: new THREE.SphereGeometry(0.32, 12, 10), glowGeo: new THREE.SphereGeometry(0.75, 12, 10),
  max() { return Drone.cfg().psMax || 3; },
  ensure() { if (G.drone.owned && G.drone.ps == null) { G.drone.ps = this.max(); G.drone.psT = 0; } },
  fire() {
    if (!G.drone.owned || G.drone.destroyed) { Drone.press(); return; }
    this.ensure(); if (game.mode === 'trans' || panelOpen() || P.wx == null) return;
    if (Drone.state === 'docked') { Drone.press(); toast('🚁 Drone airborne · press again for POWER SHOT'); return; }
    if (Drone.state !== 'escort' && Drone.state !== 'attack') { toast('Drone recharging / returning · POWER SHOT unavailable'); SFX.play('error'); return; }
    if (G.drone.ps <= 0 && !(Ads.extraPs > 0)) { if (Ads.offer('drone')) return; toast('No POWER SHOT left · next shot in ' + Math.ceil(G.drone.psT) + ' s'); SFX.play('error'); return; }
    if (this.cd > 0) { toast('POWER SHOT cooling down · ' + this.cd.toFixed(1) + ' s'); return; }
    const c = Drone.cfg(); let tg = Drone.state === 'attack' && Drone.target ? Drone.target : Drone.pickTarget();
    if (tg && !(tg.kind === 'pirate' ? tg.o.alive : tg.o.present)) tg = Drone.pickTarget();
    if (!tg) { toast('No target in POWER SHOT range (' + c.range + ' m)'); return; }
    if (hyp(tg.o.x - Drone.x, tg.o.z - Drone.z) > c.range * 1.25) { toast('Target too far · move the drone closer'); return; }
    if (Ads.extraPs > 0) Ads.extraPs--; else { G.drone.ps--; if (!(G.drone.psT > 0)) G.drone.psT = c.psReload; } this.cd = 2.5; markDirty();
    const m = mesh(this.geo, new THREE.MeshBasicMaterial({ color: '#FFF1B8' }), false); m.add(mesh(this.glowGeo, new THREE.MeshBasicMaterial({ color: '#FF8A3D', transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }), false));
    m.position.set(Drone.x, Drone.y - 0.2, Drone.z); scene.add(m);
    this.shots.push({ m, tg, fx: Drone.x, fy: Drone.y - 0.2, fz: Drone.z, t: 0, T: clamp(hyp(tg.o.x - Drone.x, tg.o.z - Drone.z) / 38, 0.25, 0.9), dmg: c.psDmg });
    SFX.play('cannon'); SFX.play('zap'); CAM.shake = Math.max(CAM.shake, 0.25); burst(Drone.x, Drone.y, Drone.z, 10, '#FFB03B', 4, 0.12); floatText('POWER SHOT!', Drone.x, Drone.y + 1, Drone.z, 'big');
  },
  update(dt) {
    this.cd = Math.max(0, this.cd - dt);
